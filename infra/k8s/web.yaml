apiVersion: apps/v1
kind: Deployment
metadata:
  name: adona-web
  labels: { app: adona-web }
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: adona-web }
  template:
    metadata:
      labels: { app: adona-web }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: ghcr.io/adona/web:latest
          ports: [{ containerPort: 3000, name: http }]
          env:
            - name: NEXT_PUBLIC_API_URL
              value: https://api.adonalingerie.pt
          resources:
            requests: { cpu: 150m, memory: 256Mi }
            limits:   { cpu: 800m, memory: 768Mi }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
          volumeMounts:
            - { name: cache, mountPath: /app/apps/web/.next/cache }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: adona-web
spec:
  selector: { app: adona-web }
  ports: [{ port: 80, targetPort: 3000, name: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: adona-web
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: adona-web }
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 75 } }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{ type: Percent, value: 50, periodSeconds: 60 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: adona-web
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: adona-web }
